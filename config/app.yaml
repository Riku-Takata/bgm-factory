app:
  timezone: Asia/Tokyo
  auto_upload: true
  auto_publish: true

generation:
  enabled: true
  engine: ace_step
  duration_sec: 16
  candidates_per_theme: 3
  batch_size: 3
  default_theme: summer_drive
  inference_steps: 8
  poll_interval_sec: 2
  timeout_sec: 900

resource_guard:
  gpu_utilization_max: 35
  min_free_vram_mb: 6000
  min_free_vram_loaded_mb: 1200
  gpu_temperature_max: 78
  check_interval_sec: 60

audio:
  target_lufs: -14
  true_peak_db: -1.5

hook:
  duration_sec: 7.5
  window_step_sec: 0.5
  min_score: 0.70

loop:
  crossfade_ms: 250
  min_score: 0.70

asset:
  min_final_score: 0.70

shorts:
  asset_count: 5
  width: 720
  height: 1280
  fps: 24
  video_encoder: h264_nvenc
  target_duration_sec: 40

long_mix:
  width: 1920
  height: 1080
  fps: 30
  track_crossfade_sec: 1.5
  targets: [600, 1800, 3600]

storage:
  minimum_free_gb: 20
  rejected_retention_days: 7
  uploaded_video_retention_days: 30

schedule:
  enabled: true
  generation_hour: 3
  generation_minute: 15
  production_hour: 6
  production_minute: 0
  production_times: ["06:00", "13:00", "20:00"]
  cleanup_hour: 4
  cleanup_minute: 0

analytics:
  enabled: true
  collection_hour: 5
  collection_minute: 0
  lookback_days: 90

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8787

pexels:
  enabled: true
  api_key_env: PEXELS_API_KEY
  min_width: 720
  min_height: 1280
  min_duration_sec: 8
  max_duration_sec: 90
  max_download_mb: 150
  request_timeout_sec: 30
  daily_downloads: 2

youtube:
  region: JP
  category_id: 10
  upload_privacy: public
  contains_synthetic_media: true
  expected_channel_id:
  upload_poll_minutes: 15
