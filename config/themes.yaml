summer_drive:
  display_name: Summer Drive
  video_queries:
    - coastal road driving
    - ocean sunlight
    - palm tree road
    - sunset highway
    - neon city driving
  bpm: {min: 118, max: 132}
  energy: {min: 0.70, max: 0.95}
  keywords:
    - bright electronic pop
    - warm synth bass
    - catchy pluck melody
    - refreshing
    - open-air feeling
    - driving rhythm
